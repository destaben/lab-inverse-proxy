worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  server_tokens off;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;

  limit_req_zone $binary_remote_addr zone=public_api:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=reticulum_lab:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=per_client:10m;
  limit_conn_zone $server_name zone=printer_download:1m;

  upstream signal_relay {
    server signal-relay:8787;
  }

  upstream home_assistant {
    server host.docker.internal:8123;
  }

  # Moonraker behind Traefik on the printer host. The address lives only in the private .env (PRINTER_HOST).
  upstream printer {
    server printer.internal:80;
  }

  server {
    listen 8080;
    server_name _;

    real_ip_header CF-Connecting-IP;
    set_real_ip_from 172.30.250.2/32;
    real_ip_recursive off;

    client_max_body_size 4k;
    client_body_buffer_size 4k;
    client_body_timeout 10s;
    client_header_buffer_size 1k;
    client_header_timeout 10s;
    large_client_header_buffers 2 4k;
    keepalive_timeout 15s;
    reset_timedout_connection on;
    limit_req zone=public_api burst=10 nodelay;
    limit_req_status 429;
    limit_conn per_client 10;
    limit_conn_status 429;

    add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 75s;
    proxy_send_timeout 15s;

    location = /healthz {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/contact {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/inbox {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/capabilities {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/reticulum-nodes {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/metrics {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/home-status {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/printer {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/printer/thumbnail {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location ~ "^/v1/lab/printer/model/[a-f0-9]{32}\z" {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://signal_relay;
    }

    location = /v1/lab/sessions {
      if ($request_method !~ ^(POST|OPTIONS)$) { return 405; }
      limit_req zone=reticulum_lab burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://signal_relay;
    }

    location /v1/lab/sessions/ {
      if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) { return 405; }
      limit_req zone=reticulum_lab burst=2 nodelay;
      limit_req_status 429;
      proxy_pass http://signal_relay;
    }

    location / { return 404; }
  }

  server {
    listen 8081;
    server_name _;

    client_max_body_size 1k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_connect_timeout 5s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;

    location = /api/ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://home_assistant;
    }

    location ~ ^/api/states/[-_a-zA-Z0-9.]+$ {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      proxy_pass http://home_assistant;
    }
    location / { return 404; }
  }

  # Internal-only Moonraker reads for the printer laboratory. No host port and no Cloudflare ingress.
  # Moonraker trusts the whole LAN (G-code, emergency stop, file deletion), so this exact GET-only
  # allowlist is the only path the relay has to it. The printer host is resource-constrained and shares
  # its CPU with the print itself, so G-code downloads are serialised and throttled.
  # Location regexes match the decoded URI (a space arrives as a literal space, never %20), while
  # $args stays encoded. \z is used instead of $ because PCRE's $ also accepts a trailing newline.
  server {
    listen 8082;
    server_name _;

    merge_slashes off;
    client_max_body_size 1k;
    client_header_timeout 5s;
    client_body_timeout 5s;
    keepalive_timeout 5s;
    limit_conn_status 429;
    proxy_http_version 1.1;
    proxy_set_header Host printer.internal;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_redirect off;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 5s;
    proxy_max_temp_file_size 0;

    location = /printer/objects/query {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      if ($args != "print_stats&virtual_sdcard") { return 404; }
      proxy_pass http://printer;
    }

    location = /server/files/metadata {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      if ($args !~ "^filename=(?:[-A-Za-z0-9_+]|%20|\.(?!\.))+\.gcode\z") { return 404; }
      proxy_pass http://printer;
    }

    location ~ "^/server/files/gcodes/\.thumbs/(?:[-A-Za-z0-9_+ ]|\.(?!\.))+-[0-9]{2,4}x[0-9]{2,4}\.png\z" {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      if ($args != "") { return 404; }
      proxy_pass http://printer;
    }

    location ~ "^/server/files/gcodes/(?:[-A-Za-z0-9_+ ]|\.(?!\.))+\.gcode\z" {
      if ($request_method !~ ^(GET|HEAD)$) { return 405; }
      if ($args != "") { return 404; }
      limit_conn printer_download 1;
      limit_rate 1m;
      proxy_read_timeout 30s;
      send_timeout 30s;
      proxy_pass http://printer;
    }

    location / { return 404; }
  }
}
